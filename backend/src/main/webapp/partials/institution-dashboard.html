<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Institution Dashboard — CareConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --pine: #1F4D3D;
    --pine-dark: #123328;
    --marigold: #D9A441;
    --marigold-dark: #B8842B;
    --cream: #FBF8F2;
    --paper: #FFFFFF;
    --ink: #1D231F;
    --ink-soft: #5B6660;
    --line: #E3DED2;
    --danger: #B3452C;
    --ok: #3D6B4A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0 0 4px 0;
    color:var(--pine-dark);
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  header{
    background:var(--pine);
    color:var(--cream);
    padding:28px 32px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
  }
  header h1{ color:var(--cream); font-size:28px; }
  header p{ margin:4px 0 0; color:#CFE0D6; font-size:14px; }
  .id-box{
    background:var(--pine-dark);
    padding:10px 14px;
    border-radius:6px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
  }
  .id-box input{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--marigold);
    color:var(--cream);
    font-family:'IBM Plex Mono', monospace;
    padding:4px 2px;
    width:70px;
  }
  .id-box input:focus{ outline:none; border-bottom-color:#fff; }
  main{
    max-width:960px;
    margin:0 auto;
    padding:32px;
  }
  section{ margin-bottom:44px; }
  section > .section-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:2px solid var(--pine);
    padding-bottom:8px;
    margin-bottom:16px;
  }
  .status{
    font-size:13px;
    color:var(--ink-soft);
  }
  button{
    font-family:'Public Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    border:none;
    border-radius:5px;
    padding:8px 14px;
    cursor:pointer;
    transition:opacity .15s;
  }
  button:hover{ opacity:.85; }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--pine); color:#fff; }
  .btn-gold{ background:var(--marigold); color:var(--pine-dark); }
  .btn-outline{ background:transparent; color:var(--pine); border:1px solid var(--pine); }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); }
  .btn-accept{ background:var(--ok); color:#fff; }
  .btn-reject{ background:var(--danger); color:#fff; }
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px 20px;
    margin-bottom:14px;
  }
  .card-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
  }
  .tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--pine-dark);
    background:#E7F0EA;
    border-radius:4px;
    padding:2px 8px;
    margin-top:4px;
  }
  .meta{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .rsvp-list{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:13px;
  }
  .rsvp-list div{ padding:2px 0; }
  form.inline-form{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px 20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  form.inline-form .full{ grid-column:1 / -1; }
  label{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    display:block;
    margin-bottom:4px;
  }
  input, select, textarea{
    width:100%;
    font-family:'Public Sans', sans-serif;
    font-size:14px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:5px;
    background:#fff;
    color:var(--ink);
  }
  textarea{ resize:vertical; min-height:60px; }
  .empty{
    color:var(--ink-soft);
    font-size:14px;
    font-style:italic;
    padding:16px 0;
  }
  .error-msg{
    background:#FBEAE4;
    color:var(--danger);
    border:1px solid #EAB9A8;
    border-radius:6px;
    padding:8px 12px;
    font-size:13px;
    margin-bottom:12px;
  }
  .reg-card .status-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:10px;
  }
  .pill-pending{ background:#FCEFD8; color:var(--marigold-dark); }
  .pill-accepted{ background:#E1EFE5; color:var(--ok); }
  .pill-rejected{ background:#FBEAE4; color:var(--danger); }
  .pill-completed{ background:#E3E9F2; color:#3B5378; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Institution Dashboard</h1>
    <p id="header-sub">Manage your events and volunteer requests — CareConnect</p>
  </div>
  <div class="id-box">
    <span id="institution-name-display">Loading…</span>
    <button class="btn-outline" style="color:var(--cream);border-color:var(--cream);" onclick="doLogout()">Log out</button>
  </div>
</header>
<div id="auth-gate" style="display:none; max-width:480px; margin:60px auto; text-align:center;">
  <h2 id="auth-gate-title">Checking your session…</h2>
  <p id="auth-gate-msg" style="color:var(--ink-soft);"></p>
  <a id="auth-gate-link" class="btn btn-primary" style="display:none;" href="pages/auth/login.html">Go to login</a>
</div>
<main id="dashboard-main" style="display:none;">

  <section id="donations-section">
    <div class="section-head">
      <h2>Donations</h2>
      <span class="status mono" id="donations-status"></span>
    </div>
    <div id="donations-list"></div>
  </section>

  <section id="needs-section">
    <div class="section-head">
      <h2>My Needs</h2>
      <span class="status mono" id="needs-status"></span>
    </div>
    <div id="needs-list"></div>

    <h3 style="margin-top:24px;">Post a new need</h3>
    <form class="inline-form" id="create-need-form" onsubmit="handleCreateNeed(event)">
      <div>
        <label>Item name</label>
        <input name="itemName" required>
      </div>
      <div>
        <label>Category</label>
        <input name="category" placeholder="e.g. Food, Clothing, Medical" required>
      </div>
      <div>
        <label>Quantity required</label>
        <input name="quantityRequired" type="number" min="1" required>
      </div>
      <div>
        <label>Urgency</label>
        <select name="urgency">
          <option value="LOW">Low</option>
          <option value="MEDIUM" selected>Medium</option>
          <option value="HIGH">High</option>
          <option value="CRITICAL">Critical</option>
        </select>
      </div>
      <div class="full">
        <label>Description</label>
        <textarea name="description"></textarea>
      </div>
      <div class="full">
        <button type="submit" class="btn-primary">Post need</button>
      </div>
    </form>
  </section>

  <section id="events-section">
    <div class="section-head">
      <h2>My Events</h2>
      <span class="status mono" id="events-status"></span>
    </div>
    <div id="events-list"></div>

    <h3 style="margin-top:24px;">Create a new event</h3>
    <form class="inline-form" id="create-event-form" onsubmit="handleCreateEvent(event)">
      <div>
        <label>Title</label>
        <input name="title" required>
      </div>
      <div>
        <label>Category</label>
        <select name="category">
          <option value="FESTIVAL">Festival</option>
          <option value="VISIT">Visit</option>
          <option value="CELEBRATION">Celebration</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div>
        <label>Date</label>
        <input name="eventDate" type="date" required>
      </div>
      <div>
        <label>Time (optional)</label>
        <input name="eventTime" type="time">
      </div>
      <div class="full">
        <label>Location</label>
        <input name="location">
      </div>
      <div class="full">
        <label>Description</label>
        <textarea name="description"></textarea>
      </div>
      <div class="full">
        <button type="submit" class="btn-primary">Create event</button>
      </div>
    </form>
  </section>

  <section id="opportunities-section">
    <div class="section-head">
      <h2>My Volunteer Opportunities</h2>
      <span class="status mono" id="opps-status"></span>
    </div>
    <div id="opportunities-list"></div>
  </section>

</main>

<script src="js/api.js"></script>
<script src="js/session.js"></script>
<script>
  let institutionId = null;
  let currentUser = null;

  // ---------- AUTH GATE ----------

  async function init(){
    const gate = document.getElementById('auth-gate');
    const gateTitle = document.getElementById('auth-gate-title');
    const gateMsg = document.getElementById('auth-gate-msg');
    const gateLink = document.getElementById('auth-gate-link');

    await Session.refresh();

    if(!Session.isLoggedIn()){
      gate.style.display = 'block';
      gateTitle.textContent = 'Please log in';
      gateMsg.textContent = 'You need to be logged in as an institution to view this dashboard.';
      gateLink.style.display = 'inline-block';
      gateLink.href = 'pages/auth/login.html?redirect=' + encodeURIComponent(window.location.pathname);
      return;
    }

    if(Session.getCurrentRole() !== 'INSTITUTION'){
      gate.style.display = 'block';
      gateTitle.textContent = "This page is for institutions only";
      gateMsg.textContent = "You're logged in as a " + Session.getCurrentRole() + ", which can't access the institution dashboard.";
      return;
    }

    currentUser = Session.getCurrentUser();

    try{
      const inst = await Api.institutions.getByUserId(Session.getCurrentUserId());
      if(!inst){
        gate.style.display = 'block';
        gateTitle.textContent = 'No institution profile found';
        gateMsg.textContent = "You're logged in, but haven't registered an institution yet.";
        gateLink.style.display = 'inline-block';
        gateLink.textContent = 'Register your institution';
        gateLink.href = 'pages/institution/register.html';
        return;
      }
      institutionId = inst.institutionId;
      document.getElementById('institution-name-display').textContent = inst.institutionName;
      document.getElementById('header-sub').textContent =
        'Manage your events and volunteer requests — ' + inst.institutionName;

      document.getElementById('dashboard-main').style.display = 'block';
      loadEvents();
      loadDonations();
      loadNeeds();
      loadOpportunities();

    } catch(err){
      gate.style.display = 'block';
      gateTitle.textContent = 'Could not load your institution';
      gateMsg.textContent = err.message;
    }
  }

  async function doLogout(){
    await Session.logout();
    window.location.href = 'careconnect-homepage.html';
  }

  window.addEventListener('DOMContentLoaded', init);

  // ---------- EVENTS ----------

  async function loadEvents(){
    const listEl = document.getElementById('events-list');
    const statusEl = document.getElementById('events-status');
    statusEl.textContent = 'loading…';
    try{
      const events = await Api.events.listByInstitution(institutionId);
      statusEl.textContent = events.length + ' event(s)';
      if(events.length === 0){
        listEl.innerHTML = '<div class="empty">No events yet. Create one below.</div>';
        return;
      }
      listEl.innerHTML = '';
      for(const ev of events){
        listEl.appendChild(renderEventCard(ev));
      }
    } catch(err){
      statusEl.textContent = '';
      listEl.innerHTML = '<div class="error-msg">Could not load events: ' + err.message + '</div>';
    }
  }

  function renderEventCard(ev){
    const wrap = document.createElement('div');
    wrap.className = 'card';
    wrap.innerHTML = `
      <div class="card-row">
        <div>
          <h3>${escapeHtml(ev.title)}</h3>
          <span class="tag">${escapeHtml(ev.category)}</span>
          <div class="meta">${escapeHtml(ev.eventDate || '')} ${ev.eventTime ? ' · ' + escapeHtml(ev.eventTime) : ''} ${ev.location ? ' · ' + escapeHtml(ev.location) : ''}</div>
          <div class="meta">${escapeHtml(ev.description || '')}</div>
        </div>
        <div class="actions">
          <button class="btn-outline" onclick="toggleRsvps(${ev.eventId}, this)">Who's going</button>
          <button class="btn-gold" onclick="startEdit(${ev.eventId})">Edit</button>
          <button class="btn-danger" onclick="deleteEvent(${ev.eventId})">Delete</button>
        </div>
      </div>
      <div class="rsvp-list" id="rsvp-${ev.eventId}" style="display:none;"></div>
      <div id="edit-${ev.eventId}"></div>
    `;
    wrap.dataset.event = JSON.stringify(ev);
    return wrap;
  }

  async function toggleRsvps(eventId, btn){
    const box = document.getElementById('rsvp-' + eventId);
    if(box.style.display === 'block'){
      box.style.display = 'none';
      return;
    }
    box.style.display = 'block';
    box.innerHTML = 'loading…';
    try{
      const [rsvps, countRes] = await Promise.all([
        Api.rsvps.listByEvent(eventId),
        Api.rsvps.countGoing(eventId)
      ]);
      if(rsvps.length === 0){
        box.innerHTML = '<div class="empty">No RSVPs yet.</div>';
        return;
      }
      box.innerHTML = '<strong>' + countRes.going + ' going</strong><br>' +
        rsvps.map(r => `<div>User #${r.userId} — <span class="mono">${escapeHtml(r.response)}</span></div>`).join('');
    } catch(err){
      box.innerHTML = '<div class="error-msg">' + err.message + '</div>';
    }
  }

  function startEdit(eventId){
    const card = [...document.querySelectorAll('#events-list .card')]
      .find(c => JSON.parse(c.dataset.event).eventId === eventId);
    const ev = JSON.parse(card.dataset.event);
    const editBox = document.getElementById('edit-' + eventId);
    if(editBox.innerHTML){ editBox.innerHTML = ''; return; }
    editBox.innerHTML = `
      <form class="inline-form" style="margin-top:12px;" onsubmit="submitEdit(event, ${eventId})">
        <div><label>Title</label><input name="title" value="${escapeAttr(ev.title)}" required></div>
        <div>
          <label>Category</label>
          <select name="category">
            ${['FESTIVAL','VISIT','CELEBRATION','OTHER'].map(c =>
              `<option value="${c}" ${ev.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div><label>Date</label><input name="eventDate" type="date" value="${ev.eventDate||''}" required></div>
        <div><label>Time</label><input name="eventTime" type="time" value="${ev.eventTime||''}"></div>
        <div class="full"><label>Location</label><input name="location" value="${escapeAttr(ev.location||'')}"></div>
        <div class="full"><label>Description</label><textarea name="description">${escapeHtml(ev.description||'')}</textarea></div>
        <div class="full">
          <button type="submit" class="btn-primary">Save changes</button>
        </div>
      </form>
    `;
  }

  async function submitEdit(e, eventId){
    e.preventDefault();
    const f = e.target;
    const payload = {
      institutionId: Number(institutionId),
      title: f.title.value,
      description: f.description.value,
      eventDate: f.eventDate.value,
      eventTime: f.eventTime.value || null,
      location: f.location.value,
      category: f.category.value
    };
    try{
      await Api.events.update(eventId, payload);
      loadEvents();
    } catch(err){
      alert('Could not save: ' + err.message);
    }
  }

  async function deleteEvent(eventId){
    if(!confirm('Delete this event? This cannot be undone.')) return;
    try{
      await Api.events.remove(eventId);
      loadEvents();
    } catch(err){
      alert('Could not delete: ' + err.message);
    }
  }

  async function handleCreateEvent(e){
    e.preventDefault();
    const f = e.target;
    const payload = {
      institutionId: Number(institutionId),
      title: f.title.value,
      description: f.description.value,
      eventDate: f.eventDate.value,
      eventTime: f.eventTime.value || null,
      location: f.location.value,
      category: f.category.value
    };
    try{
      await Api.events.create(payload);
      f.reset();
      loadEvents();
    } catch(err){
      alert('Could not create event: ' + err.message);
    }
  }

  // ---------- DONATIONS ----------

  async function loadDonations(){
    const listEl = document.getElementById('donations-list');
    const statusEl = document.getElementById('donations-status');
    statusEl.textContent = 'loading…';
    try{
      const [money, items] = await Promise.all([
        Api.donations.listByInstitution(institutionId),
        Api.itemDonations.listByInstitution(institutionId)
      ]);
      const total = money.length + items.length;
      statusEl.textContent = total + ' donation(s)';
      if(total === 0){
        listEl.innerHTML = '<div class="empty">No donations yet.</div>';
        return;
      }
      listEl.innerHTML = '';
      money.forEach(d => listEl.appendChild(renderMoneyDonationCard(d)));
      items.forEach(d => listEl.appendChild(renderItemDonationCard(d)));
    } catch(err){
      statusEl.textContent = '';
      listEl.innerHTML = '<div class="error-msg">Could not load donations: ' + err.message + '</div>';
    }
  }

  function renderMoneyDonationCard(d){
    const wrap = document.createElement('div');
    wrap.className = 'card';
    const status = (d.paymentStatus || 'PENDING').toUpperCase();
    const pillClass = status === 'COMPLETED' ? 'pill-accepted' : status === 'CANCELLED' ? 'pill-rejected' : 'pill-pending';
    wrap.innerHTML = `
      <div class="card-row">
        <div>
          <h3>₹${d.amount} — Money donation</h3>
          <span class="tag">Donor #${d.donorId}</span>
          ${d.needId ? `<span class="tag" style="margin-left:6px;">Need #${d.needId}</span>` : ''}
          <div class="meta">Payment: <span class="status-pill ${pillClass}">${status}</span></div>
        </div>
      </div>
    `;
    return wrap;
  }

  function renderItemDonationCard(d){
    const wrap = document.createElement('div');
    wrap.className = 'card';
    const status = (d.deliveryStatus || 'PENDING').toUpperCase();
    const pillClass = status === 'DELIVERED' ? 'pill-accepted' : status === 'CANCELLED' ? 'pill-rejected' : status === 'PICKED_UP' ? 'pill-completed' : 'pill-pending';
    wrap.innerHTML = `
      <div class="card-row">
        <div>
          <h3>${escapeHtml(d.itemName)} × ${d.quantity} — Item donation</h3>
          <span class="tag">${escapeHtml(d.pickupOrDrop)}</span>
          ${d.needId ? `<span class="tag" style="margin-left:6px;">Need #${d.needId}</span>` : ''}
          <div class="meta">Status: <span class="status-pill ${pillClass}">${status}</span></div>
          ${d.pickupAddress ? `<div class="meta">Pickup from: ${escapeHtml(d.pickupAddress)}</div>` : ''}
        </div>
        <div class="actions" id="item-donation-actions-${d.itemDonationId}">
          ${status === 'PENDING' && d.pickupOrDrop === 'PICKUP' ? `<button class="btn-gold" onclick="itemDonationAction(${d.itemDonationId}, 'markPickedUp')">Mark picked up</button>` : ''}
          ${(status === 'PENDING' || status === 'PICKED_UP') ? `<button class="btn-accept" onclick="itemDonationAction(${d.itemDonationId}, 'markDelivered')">Mark delivered</button>` : ''}
          ${status !== 'DELIVERED' && status !== 'CANCELLED' ? `<button class="btn-danger" onclick="itemDonationAction(${d.itemDonationId}, 'cancel')">Cancel</button>` : ''}
        </div>
      </div>
    `;
    return wrap;
  }

  async function itemDonationAction(itemDonationId, action){
    try{
      await Api.itemDonations[action](itemDonationId);
      loadDonations();
      loadNeeds(); // delivering can advance a linked need's progress/status
    } catch(err){
      alert('Could not update: ' + err.message);
    }
  }

  // ---------- NEEDS ----------

  async function loadNeeds(){
    const listEl = document.getElementById('needs-list');
    const statusEl = document.getElementById('needs-status');
    statusEl.textContent = 'loading…';
    try{
      const needs = await Api.needs.listByInstitution(institutionId);
      statusEl.textContent = needs.length + ' need(s)';
      if(needs.length === 0){
        listEl.innerHTML = '<div class="empty">No needs posted yet.</div>';
        return;
      }
      listEl.innerHTML = '';
      for(const n of needs){
        listEl.appendChild(renderNeedCard(n));
      }
    } catch(err){
      statusEl.textContent = '';
      listEl.innerHTML = '<div class="error-msg">Could not load needs: ' + err.message + '</div>';
    }
  }

  function renderNeedCard(n){
    const wrap = document.createElement('div');
    wrap.className = 'card';
    const pct = n.quantityRequired > 0
      ? Math.min(100, Math.round((n.quantityReceived / n.quantityRequired) * 100))
      : 0;
    wrap.innerHTML = `
      <div class="card-row">
        <div>
          <h3>${escapeHtml(n.itemName)}</h3>
          <span class="tag">${escapeHtml(n.category)}</span>
          <span class="tag" style="margin-left:6px;">${escapeHtml(n.urgency)}</span>
          <div class="meta">${escapeHtml(n.description || '')}</div>
          <div class="meta">${n.quantityReceived} / ${n.quantityRequired} received · <strong>${escapeHtml(n.status)}</strong> (updates automatically as donations are delivered)</div>
        </div>
        <div class="actions">
          <button class="btn-gold" onclick="startEditNeed(${n.needId})">Edit</button>
          <button class="btn-danger" onclick="deleteNeed(${n.needId})">Delete</button>
        </div>
      </div>
      <div id="edit-need-${n.needId}"></div>
    `;
    wrap.dataset.need = JSON.stringify(n);
    return wrap;
  }

  function startEditNeed(needId){
    const card = [...document.querySelectorAll('#needs-list .card')]
      .find(c => JSON.parse(c.dataset.need).needId === needId);
    const n = JSON.parse(card.dataset.need);
    const editBox = document.getElementById('edit-need-' + needId);
    if(editBox.innerHTML){ editBox.innerHTML = ''; return; }
    editBox.innerHTML = `
      <form class="inline-form" style="margin-top:12px;" onsubmit="submitEditNeed(event, ${needId})">
        <div><label>Item name</label><input name="itemName" value="${escapeAttr(n.itemName)}" required></div>
        <div><label>Category</label><input name="category" value="${escapeAttr(n.category)}" required></div>
        <div><label>Quantity required</label><input name="quantityRequired" type="number" min="1" value="${n.quantityRequired}" required></div>
        <div>
          <label>Urgency</label>
          <select name="urgency">
            ${['LOW','MEDIUM','HIGH','CRITICAL'].map(u =>
              `<option value="${u}" ${n.urgency===u?'selected':''}>${u}</option>`).join('')}
          </select>
        </div>
        <div class="full"><label>Description</label><textarea name="description">${escapeHtml(n.description||'')}</textarea></div>
        <div class="full">
          <button type="submit" class="btn-primary">Save changes</button>
        </div>
      </form>
    `;
  }

  async function submitEditNeed(e, needId){
    e.preventDefault();
    const f = e.target;
    const payload = {
      category: f.category.value,
      itemName: f.itemName.value,
      quantityRequired: Number(f.quantityRequired.value),
      urgency: f.urgency.value,
      description: f.description.value
    };
    try{
      await Api.needs.update(needId, payload);
      loadNeeds();
    } catch(err){
      alert('Could not save: ' + err.message);
    }
  }

  async function deleteNeed(needId){
    if(!confirm('Delete this need? This cannot be undone.')) return;
    try{
      await Api.needs.remove(needId);
      loadNeeds();
    } catch(err){
      alert('Could not delete: ' + err.message);
    }
  }

  async function handleCreateNeed(e){
    e.preventDefault();
    const f = e.target;
    const payload = {
      institutionId: Number(institutionId),
      category: f.category.value,
      itemName: f.itemName.value,
      quantityRequired: Number(f.quantityRequired.value),
      urgency: f.urgency.value,
      description: f.description.value
    };
    try{
      await Api.needs.create(payload);
      f.reset();
      loadNeeds();
    } catch(err){
      alert('Could not post need: ' + err.message);
    }
  }

  // ---------- VOLUNTEER OPPORTUNITIES + REGISTRATIONS ----------

  async function loadOpportunities(){
    const listEl = document.getElementById('opportunities-list');
    const statusEl = document.getElementById('opps-status');
    statusEl.textContent = 'loading…';
    try{
      const opps = await Api.opportunities.listByInstitution(institutionId);
      statusEl.textContent = opps.length + ' opportunit' + (opps.length === 1 ? 'y' : 'ies');
      if(opps.length === 0){
        listEl.innerHTML = '<div class="empty">No volunteer opportunities posted yet.</div>';
        return;
      }
      listEl.innerHTML = '';
      for(const opp of opps){
        listEl.appendChild(renderOpportunityCard(opp));
      }
    } catch(err){
      statusEl.textContent = '';
      listEl.innerHTML = '<div class="error-msg">Could not load opportunities: ' + err.message + '</div>';
    }
  }

  function renderOpportunityCard(opp){
    const wrap = document.createElement('div');
    wrap.className = 'card';
    wrap.innerHTML = `
      <div class="card-row">
        <div>
          <h3>${escapeHtml(opp.title)}</h3>
          <span class="tag">${escapeHtml(opp.status)}</span>
          <div class="meta">${escapeHtml(opp.eventDate || '')} ${opp.location ? ' · ' + escapeHtml(opp.location) : ''}</div>
        </div>
        <div class="actions">
          <button class="btn-outline" onclick="loadRegistrations(${opp.opportunityId}, this)">View applicants</button>
        </div>
      </div>
      <div class="rsvp-list" id="regs-${opp.opportunityId}" style="display:none;"></div>
    `;
    return wrap;
  }

  async function loadRegistrations(opportunityId, btn){
    const box = document.getElementById('regs-' + opportunityId);
    if(box.style.display === 'block'){ box.style.display = 'none'; return; }
    box.style.display = 'block';
    box.innerHTML = 'loading…';
    try{
      const regs = await Api.registrations.listByOpportunity(opportunityId);
      if(regs.length === 0){
        box.innerHTML = '<div class="empty">No applicants yet.</div>';
        return;
      }
      box.innerHTML = '';
      for(const r of regs){
        box.appendChild(renderRegistrationCard(r, opportunityId));
      }
    } catch(err){
      box.innerHTML = '<div class="error-msg">' + err.message + '</div>';
    }
  }

  function renderRegistrationCard(r, opportunityId){
    const wrap = document.createElement('div');
    wrap.className = 'card reg-card';
    const status = (r.status || 'PENDING').toUpperCase();
    const pillClass = {
      PENDING:'pill-pending', ACCEPTED:'pill-accepted',
      REJECTED:'pill-rejected', COMPLETED:'pill-completed'
    }[status] || 'pill-pending';

    wrap.innerHTML = `
      <div class="card-row">
        <div>
          <h3>Volunteer #${r.volunteerId}</h3>
          <span class="status-pill ${pillClass}">${status}</span>
        </div>
        <div class="actions" id="reg-actions-${r.registrationId}">
          ${status === 'PENDING' ? `
            <button class="btn-accept" onclick="actOnRegistration(${r.registrationId}, 'accept', ${opportunityId})">Accept</button>
            <button class="btn-reject" onclick="actOnRegistration(${r.registrationId}, 'reject', ${opportunityId})">Reject</button>
          ` : ''}
          ${status === 'ACCEPTED' ? `
            <button class="btn-gold" onclick="actOnRegistration(${r.registrationId}, 'complete', ${opportunityId})">Mark completed</button>
          ` : ''}
        </div>
      </div>
    `;
    return wrap;
  }

  async function actOnRegistration(registrationId, action, opportunityId){
    try{
      await Api.registrations[action](registrationId);
      const box = document.getElementById('regs-' + opportunityId);
      box.style.display = 'none';
      loadRegistrations(opportunityId);
    } catch(err){
      alert('Could not update: ' + err.message);
    }
  }

  // ---------- helpers ----------
  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, s => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[s]));
  }
  function escapeAttr(str){ return escapeHtml(str); }
</script>

</body>
</html>
