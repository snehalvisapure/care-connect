<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Institution profile — CareConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" type="image/png" href="../../assets/images/logo.png" />
</head>
<body>
  <div id="header-slot"></div>

  <main class="container page-section">
    <div class="page-header">
      <h1>Institution profile</h1>
      <span id="api-badge"></span>
    </div>

    <div id="content-slot">
      <p>Loading...</p>
    </div>
  </main>

  <div id="footer-slot"></div>

  <!-- Shared scripts (order matters: api -> session -> ui-helpers) -->
  <script src="../../js/api.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/ui-helpers.js"></script>
  <!-- /Shared scripts -->

  <script>
    (async () => {
      const user = await UiHelpers.bootPage({ rootPath: "../../", requireAuth: true });
      if (!user) return;

      document.getElementById("api-badge").appendChild(UiHelpers.badge("real"));

      const contentSlot = document.getElementById("content-slot");

      function statusPillClass(status) {
        if (status === "APPROVED") return "status-pill-approved";
        if (status === "REJECTED") return "status-pill-rejected";
        return "status-pill-pending";
      }

      let institution;
      try {
        institution = await Api.institutions.getByUserId(user.userId);
      } catch (err) {
        console.error(err);
        contentSlot.innerHTML = `<p>Could not load your institution. ${err.message || ""}</p>`;
        return;
      }

      if (!institution) {
        contentSlot.innerHTML = "";
        const empty = document.createElement("div");
        empty.className = "card empty-state";
        empty.innerHTML = `
          <h3>No institution registered yet</h3>
          <p>Register your old age home or orphanage to get started.</p>
        `;
        const link = document.createElement("a");
        link.className = "btn btn-primary";
        link.href = "register.html";
        link.textContent = "Register an institution";
        empty.appendChild(link);
        contentSlot.appendChild(empty);
        return;
      }

      contentSlot.innerHTML = `
        <div class="card" style="max-width: 640px;">
          <div class="page-header">
            <h3 style="margin: 0;">${institution.institutionName}</h3>
            <span class="status-pill ${statusPillClass(institution.verificationStatus)}">
              ${institution.verificationStatus}
            </span>
          </div>
          ${institution.verificationStatus === "REJECTED" && institution.rejectionReason
            ? `<p class="text-small" style="color: var(--color-urgent);">Reason: ${institution.rejectionReason}</p>`
            : ""}

          <form id="edit-form" style="margin-top: 16px;">
            <div class="form-group">
              <label for="institutionName">Institution name</label>
              <input type="text" id="institutionName" value="${institution.institutionName}" required />
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" rows="4" required>${institution.description || ""}</textarea>
            </div>

            <div class="form-group">
              <label for="address">Address</label>
              <input type="text" id="address" value="${institution.address || ""}" required />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" value="${institution.city || ""}" required />
              </div>
              <div class="form-group">
                <label for="state">State</label>
                <input type="text" id="state" value="${institution.state || ""}" required />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="pincode">Pincode</label>
                <input type="text" id="pincode" value="${institution.pincode || ""}" required />
              </div>
              <div class="form-group">
                <label for="contactPerson">Contact person</label>
                <input type="text" id="contactPerson" value="${institution.contactPerson || ""}" required />
              </div>
            </div>

            <button type="submit" class="btn btn-primary" id="save-btn">Save changes</button>
          </form>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 12px;">
          <a class="btn btn-outline btn-sm" href="dashboard.html?id=${institution.institutionId}">View dashboard</a>
          <a class="btn btn-outline btn-sm" href="documents.html?id=${institution.institutionId}">Verification documents</a>
        </div>
      `;

      document.getElementById("edit-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById("save-btn");

        const payload = {
          institutionName: document.getElementById("institutionName").value.trim(),
          institutionType: institution.institutionType, // unchanged - not editable here
          registrationNumber: institution.registrationNumber, // unchanged - not editable here
          description: document.getElementById("description").value.trim(),
          address: document.getElementById("address").value.trim(),
          city: document.getElementById("city").value.trim(),
          state: document.getElementById("state").value.trim(),
          pincode: document.getElementById("pincode").value.trim(),
          contactPerson: document.getElementById("contactPerson").value.trim(),
        };

        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";
        try {
          await Api.institutions.update(institution.institutionId, payload);
          UiHelpers.toast("Institution profile updated.", "success");
        } catch (err) {
          console.error(err);
          UiHelpers.toast(err.message || "Could not save changes.", "error");
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = "Save changes";
        }
      });
    })();
  </script>
</body>
</html>
