<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register your institution — CareConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" type="image/png" href="../../assets/images/logo.png" />
</head>
<body>
  <div id="header-slot"></div>

  <main class="container page-section">
    <div class="page-header">
      <h1>Register your institution</h1>
      <span id="api-badge"></span>
    </div>
    <p>
      Register your old age home or orphanage so you can post needs,
      receive donations, and list volunteer opportunities. Every
      institution starts as <strong>PENDING</strong> until an admin
      verifies it.
    </p>

    <div id="existing-notice"></div>

    <form id="register-form" class="card" style="max-width: 640px;">
      <div class="form-group">
        <label for="institutionName">Institution name</label>
        <input type="text" id="institutionName" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="institutionType">Institution type</label>
          <select id="institutionType" required>
            <option value="" disabled selected>Select a type</option>
            <option value="OLD_AGE_HOME">Old age home</option>
            <option value="ORPHANAGE">Orphanage</option>
          </select>
        </div>
        <div class="form-group">
          <label for="registrationNumber">Registration number</label>
          <input type="text" id="registrationNumber" required />
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" rows="4" required></textarea>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" required />
        </div>
        <div class="form-group">
          <label for="state">State</label>
          <input type="text" id="state" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="pincode">Pincode</label>
          <input type="text" id="pincode" required />
        </div>
        <div class="form-group">
          <label for="contactPerson">Contact person</label>
          <input type="text" id="contactPerson" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">Register institution</button>
    </form>
  </main>

  <div id="footer-slot"></div>

  <!-- Shared scripts (order matters: api -> session -> ui-helpers) -->
  <script src="../../js/api.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/ui-helpers.js"></script>
  <!-- /Shared scripts -->

  <script>
    (async () => {
      // Registering an institution requires a real logged-in user.
      const user = await UiHelpers.bootPage({ rootPath: "../../", requireAuth: true });
      if (!user) return; // already redirected to login

      document.getElementById("api-badge").appendChild(UiHelpers.badge("real"));

      const form = document.getElementById("register-form");
      const submitBtn = document.getElementById("submit-btn");
      const existingNotice = document.getElementById("existing-notice");

      // If this user already has an institution registered, don't let
      // them submit a duplicate - point them to their dashboard instead.
      try {
        const existing = await Api.institutions.getByUserId(user.userId);
        if (existing) {
          existingNotice.innerHTML = "";
          const notice = document.createElement("div");
          notice.className = "auth-required-notice";
          notice.innerHTML = `
            <strong>You already have an institution registered</strong>
            <p>"${existing.institutionName}" is already linked to your account.</p>
          `;
          const link = document.createElement("a");
          link.className = "btn btn-primary btn-sm";
          link.href = `dashboard.html?id=${existing.institutionId}`;
          link.textContent = "Go to dashboard";
          notice.appendChild(link);
          existingNotice.appendChild(notice);
          form.style.display = "none";
        }
      } catch (err) {
        // GET /api/institutions?userId= always returns 200 with either the
        // institution or a JSON null body (verified in InstitutionController.java)
        // - it doesn't throw for "no institution yet". A catch here would only
        // fire on a genuine network/server error, in which case we just fall
        // back to showing the empty form.
        console.warn("Could not check for an existing institution:", err);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const payload = {
          userId: user.userId,
          institutionName: document.getElementById("institutionName").value.trim(),
          institutionType: document.getElementById("institutionType").value,
          registrationNumber: document.getElementById("registrationNumber").value.trim(),
          description: document.getElementById("description").value.trim(),
          address: document.getElementById("address").value.trim(),
          city: document.getElementById("city").value.trim(),
          state: document.getElementById("state").value.trim(),
          pincode: document.getElementById("pincode").value.trim(),
          contactPerson: document.getElementById("contactPerson").value.trim(),
        };

        submitBtn.disabled = true;
        submitBtn.textContent = "Registering...";

        try {
          const institution = await Api.institutions.register(payload);
          UiHelpers.toast("Institution registered. Awaiting verification.", "success");
          window.location.href = `dashboard.html?id=${institution.institutionId}`;
        } catch (err) {
          console.error(err);
          UiHelpers.toast(err.message || "Registration failed.", "error");
          submitBtn.disabled = false;
          submitBtn.textContent = "Register institution";
        }
      });
    })();
  </script>
</body>
</html>
