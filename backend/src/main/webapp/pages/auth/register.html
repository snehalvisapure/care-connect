<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — CareConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" type="image/png" href="../../assets/images/logo.png" />
</head>
<body>
  <div id="header-slot"></div>

  <main class="container page-section" style="max-width: 640px;">
    <div class="page-header">
      <h1>Create an account</h1>
      <span id="api-badge"></span>
    </div>
    <p>
      Register as a donor, volunteer, or institution. (Institution
      accounts still need to separately register their institution
      details once logged in — that's a later step.)
    </p>

    <form id="register-form" class="card">
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" minlength="6" required />
          <small>At least 6 characters.</small>
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" />
        </div>
      </div>

      <div class="form-group">
        <label for="role">I am a...</label>
        <select id="role" required>
          <option value="" disabled selected>Select a role</option>
          <option value="DONOR">Donor</option>
          <option value="VOLUNTEER">Volunteer</option>
          <option value="INSTITUTION">Institution representative</option>
        </select>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" />
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">Create account</button>

      <p class="text-small" style="margin-top: 14px;">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </form>
  </main>

  <div id="footer-slot"></div>

  <!-- Shared scripts (order matters: api -> session -> ui-helpers) -->
  <script src="../../js/api.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/ui-helpers.js"></script>
  <!-- /Shared scripts -->

  <script>
    (async () => {
      const user = await UiHelpers.bootPage({ rootPath: "../../" });
      // Already logged in? No reason to show a register form.
      if (user) {
        window.location.href = "profile.html";
        return;
      }

      document.getElementById("api-badge").appendChild(UiHelpers.badge("real"));

      const form = document.getElementById("register-form");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const payload = {
          fullName: document.getElementById("fullName").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
          phone: document.getElementById("phone").value.trim(),
          role: document.getElementById("role").value,
          address: document.getElementById("address").value.trim(),
        };

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account...";

        try {
          await Session.register(payload);
          UiHelpers.toast("Account created. Please log in.", "success");
          window.location.href = "login.html";
        } catch (err) {
          console.error(err);
          UiHelpers.toast(err.message || "Registration failed.", "error");
          submitBtn.disabled = false;
          submitBtn.textContent = "Create account";
        }
      });
    })();
  </script>
</body>
</html>
