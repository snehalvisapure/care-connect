<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — CareConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" type="image/png" href="../../assets/images/logo.png" />
</head>
<body>
  <div id="header-slot"></div>

  <main class="container page-section">
    <div class="page-header">
      <h1>Events</h1>
      <span id="api-badge"></span>
    </div>

    <div class="form-group" style="max-width: 260px;">
      <label for="category-filter">Filter by category</label>
      <select id="category-filter">
        <option value="">All upcoming events</option>
        <option value="BIRTHDAY">Birthday</option>
        <option value="FESTIVAL">Festival</option>
        <option value="VISITING_DAY">Visiting day</option>
        <option value="FUNDRAISER">Fundraiser</option>
        <option value="MEDICAL_CAMP">Medical camp</option>
        <option value="OTHER">Other</option>
      </select>
    </div>

    <div id="content-slot">
      <p>Loading...</p>
    </div>
  </main>

  <div id="footer-slot"></div>

  <!-- Shared scripts (order matters: api -> session -> ui-helpers) -->
  <script src="../../js/api.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/ui-helpers.js"></script>
  <!-- /Shared scripts -->

  <script>
    (async () => {
      // Browsing is public - only RSVPing needs login.
      const user = await UiHelpers.bootPage({ rootPath: "../../" });

      document.getElementById("api-badge").appendChild(UiHelpers.badge("real"));

      const contentSlot = document.getElementById("content-slot");
      const categoryFilter = document.getElementById("category-filter");

      const institutionNameCache = new Map();
      async function institutionName(institutionId) {
        if (institutionNameCache.has(institutionId)) return institutionNameCache.get(institutionId);
        try {
          const inst = await Api.institutions.getById(institutionId);
          institutionNameCache.set(institutionId, inst.institutionName);
          return inst.institutionName;
        } catch (e) {
          return `Institution #${institutionId}`;
        }
      }

      async function load() {
        let events;
        try {
          events = categoryFilter.value
            ? await Api.events.listByCategory(categoryFilter.value)
            : await Api.events.listUpcoming();
        } catch (err) {
          console.error(err);
          contentSlot.innerHTML = `<p>Could not load events. ${err.message || ""}</p>`;
          return;
        }

        contentSlot.innerHTML = "";

        if (!user) {
          contentSlot.appendChild(UiHelpers.loginRequiredNotice("RSVPing to an event", "../auth/login.html"));
        }

        if (events.length === 0) {
          const empty = document.createElement("div");
          empty.className = "card empty-state";
          empty.textContent = "No events found.";
          contentSlot.appendChild(empty);
          return;
        }

        const grid = document.createElement("div");
        grid.className = "event-grid";

        for (const ev of events) {
          const instName = await institutionName(ev.institutionId);
          let goingCount = "—";
          try {
            const count = await Api.rsvps.countGoing(ev.eventId);
            goingCount = count.going;
          } catch (e) {
            console.warn("Could not load going count:", e);
          }

          let myStatus = null;
          if (user) {
            try {
              myStatus = await Api.rsvps.getMyStatus(ev.eventId, user.userId);
            } catch (e) {
              console.warn("Could not load my RSVP status:", e);
            }
          }

          const card = document.createElement("div");
          card.className = "event-card";
          card.innerHTML = `
            <div class="event-card-top">
              <div>
                <strong><a href="details.html?id=${ev.eventId}">${ev.title}</a></strong>
                <div class="text-small">${instName} · ${ev.location || "—"}</div>
              </div>
              <span class="status-pill category-pill">${ev.category}</span>
            </div>
            <p class="text-small" style="margin:0;">${ev.description || ""}</p>
            <div class="text-small">
              📅 ${UiHelpers.formatDate(ev.eventDate)}${ev.eventTime ? " · " + ev.eventTime.slice(0, 5) : ""}
              · ${goingCount} going
            </div>
            <div class="event-card-actions" id="rsvp-actions-${ev.eventId}"></div>
          `;

          const actions = card.querySelector(`#rsvp-actions-${ev.eventId}`);
          if (user) {
            const responses = ["INTERESTED", "GOING", "NOT_GOING"];
            const toggle = document.createElement("div");
            toggle.className = "rsvp-toggle";
            responses.forEach((r) => {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "btn btn-outline btn-sm" + (myStatus && myStatus.response === r ? " active" : "");
              btn.textContent = r.replace("_", " ");
              btn.addEventListener("click", async () => {
                try {
                  await Api.rsvps.setRsvp(ev.eventId, user.userId, r);
                  UiHelpers.toast("RSVP updated.", "success");
                  load();
                } catch (err) {
                  console.error(err);
                  UiHelpers.toast(err.message || "Could not update RSVP.", "error");
                }
              });
              toggle.appendChild(btn);
            });
            actions.appendChild(toggle);
          }

          grid.appendChild(card);
        }

        contentSlot.appendChild(grid);
      }

      categoryFilter.addEventListener("change", load);
      await load();
    })();
  </script>
</body>
</html>
