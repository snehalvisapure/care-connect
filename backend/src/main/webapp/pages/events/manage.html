<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage events — CareConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" type="image/png" href="../../assets/images/logo.png" />
</head>
<body>
  <div id="header-slot"></div>

  <main class="container page-section">
    <div class="page-header">
      <h1>Manage events</h1>
      <span id="api-badge"></span>
    </div>

    <div id="notice-slot"></div>

    <div id="content-slot">
      <p>Loading...</p>
    </div>
  </main>

  <div id="footer-slot"></div>

  <!-- Shared scripts (order matters: api -> session -> ui-helpers) -->
  <script src="../../js/api.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/ui-helpers.js"></script>
  <!-- /Shared scripts -->

  <script>
    (async () => {
      const user = await UiHelpers.bootPage({ rootPath: "../../", requireAuth: true });
      if (!user) return;

      document.getElementById("api-badge").appendChild(UiHelpers.badge("unenforced"));

      const notice = document.getElementById("notice-slot");
      const contentSlot = document.getElementById("content-slot");
      const params = new URLSearchParams(window.location.search);
      let institutionId = params.get("institutionId");

      async function load() {
        let events;
        try {
          events = await Api.events.listByInstitution(institutionId);
        } catch (err) {
          console.error(err);
          contentSlot.innerHTML = `<p>Could not load events. ${err.message || ""}</p>`;
          return;
        }

        contentSlot.innerHTML = `
          <div style="margin-bottom: 16px;">
            <a class="btn btn-primary btn-sm" href="create.html">Create an event</a>
          </div>
        `;

        if (events.length === 0) {
          const empty = document.createElement("div");
          empty.className = "card empty-state";
          empty.textContent = "No events created yet.";
          contentSlot.appendChild(empty);
          return;
        }

        const grid = document.createElement("div");
        grid.className = "event-grid";

        for (const ev of events) {
          let goingCount = "—";
          try {
            const count = await Api.rsvps.countGoing(ev.eventId);
            goingCount = count.going;
          } catch (e) {
            console.warn("Could not load going count:", e);
          }

          const card = document.createElement("div");
          card.className = "event-card";
          card.innerHTML = `
            <div class="event-card-top">
              <div>
                <strong>${ev.title}</strong>
                <div class="text-small">${ev.location || "—"}</div>
              </div>
              <span class="status-pill category-pill">${ev.category}</span>
            </div>
            <div class="text-small">
              📅 ${UiHelpers.formatDate(ev.eventDate)}${ev.eventTime ? " · " + ev.eventTime.slice(0, 5) : ""}
              · ${goingCount} going
            </div>
            <div class="event-card-actions">
              <a class="btn btn-outline btn-sm" href="details.html?id=${ev.eventId}">View RSVPs</a>
              <a class="btn btn-outline btn-sm" href="edit.html?id=${ev.eventId}">Edit / Delete</a>
            </div>
          `;
          grid.appendChild(card);
        }

        contentSlot.appendChild(grid);
      }

      try {
        if (!institutionId) {
          const own = await Api.institutions.getByUserId(user.userId);
          if (!own) {
            contentSlot.innerHTML = "";
            const empty = document.createElement("div");
            empty.className = "card empty-state";
            empty.innerHTML = `<h3>No institution registered yet</h3><p>Register your institution to manage events.</p>`;
            const link = document.createElement("a");
            link.className = "btn btn-primary";
            link.href = "../institution/register.html";
            link.textContent = "Register an institution";
            empty.appendChild(link);
            contentSlot.appendChild(empty);
            return;
          }
          institutionId = own.institutionId;
        } else {
          const own = await Api.institutions.getByUserId(user.userId);
          if (!own || String(own.institutionId) !== String(institutionId)) {
            const warn = document.createElement("div");
            warn.className = "pending-banner";
            warn.innerHTML = `<strong>⚠️ Heads up</strong><p>This institution ID doesn't match your own registered institution. The backend won't stop you from viewing or actioning it anyway (it doesn't check this server-side yet) - but it probably isn't what you meant to do.</p>`;
            notice.appendChild(warn);
          }
        }
        await load();
      } catch (err) {
        console.error(err);
        contentSlot.innerHTML = `<p>Could not load this page. ${err.message || ""}</p>`;
      }
    })();
  </script>
</body>
</html>
