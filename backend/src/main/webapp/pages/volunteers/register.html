<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Become a volunteer — CareConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" type="image/png" href="../../assets/images/logo.png" />
</head>
<body>
  <div id="header-slot"></div>

  <main class="container page-section">
    <div class="page-header">
      <h1>Become a volunteer</h1>
      <span id="api-badge"></span>
    </div>

    <div id="content-slot">
      <p>Loading...</p>
    </div>
  </main>

  <div id="footer-slot"></div>

  <!-- Shared scripts (order matters: api -> session -> ui-helpers) -->
  <script src="../../js/api.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/ui-helpers.js"></script>
  <!-- /Shared scripts -->

  <script>
    (async () => {
      const user = await UiHelpers.bootPage({ rootPath: "../../", requireAuth: true });
      if (!user) return;

      document.getElementById("api-badge").appendChild(UiHelpers.badge("unenforced"));

      const contentSlot = document.getElementById("content-slot");

      try {
        // The controller has no ?userId= filter, so we list everyone
        // and check client-side whether this user already has a profile.
        const all = await Api.volunteers.list();
        const existing = all.find((v) => String(v.userId) === String(user.userId));

        if (existing) {
          contentSlot.innerHTML = `
            <div class="card" style="max-width: 560px;">
              <h3 style="margin-top:0;">You're already a registered volunteer</h3>
              <p><strong>Skills:</strong> ${existing.skills || "—"}</p>
              <p><strong>Availability:</strong> ${existing.availability || "—"}</p>
              <p><strong>Experience:</strong> ${existing.experience || "—"}</p>
            </div>
            <div class="pending-banner" style="max-width: 560px; margin-top: 16px;">
              <strong>⏳ Editing isn't wired up yet</strong>
              <p>
                The backend's VolunteerService supports updating a profile,
                but that isn't exposed as an HTTP endpoint yet (no PUT
                route on the controller) - so this page can't offer an
                edit form until that's added.
              </p>
            </div>
            <div style="margin-top: 16px;">
              <a class="btn btn-primary btn-sm" href="opportunities.html">Browse opportunities</a>
            </div>
          `;
          return;
        }

        contentSlot.innerHTML = `
          <form id="register-form" class="card" style="max-width: 560px;">
            <div class="form-group">
              <label for="skills">Skills</label>
              <input type="text" id="skills" placeholder="e.g. cooking, teaching, driving" required />
            </div>
            <div class="form-group">
              <label for="availability">Availability</label>
              <input type="text" id="availability" placeholder="e.g. weekends, evenings" required />
            </div>
            <div class="form-group">
              <label for="experience">Experience</label>
              <textarea id="experience" rows="4" placeholder="Any relevant past experience (optional)"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn">Register as a volunteer</button>
          </form>
        `;

        document.getElementById("register-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById("submit-btn");
          const payload = {
            userId: user.userId,
            skills: document.getElementById("skills").value.trim(),
            availability: document.getElementById("availability").value.trim(),
            experience: document.getElementById("experience").value.trim(),
          };

          submitBtn.disabled = true;
          submitBtn.textContent = "Registering...";

          try {
            await Api.volunteers.create(payload);
            UiHelpers.toast("You're registered as a volunteer!", "success");
            window.location.href = "opportunities.html";
          } catch (err) {
            console.error(err);
            UiHelpers.toast(err.message || "Could not register.", "error");
            submitBtn.disabled = false;
            submitBtn.textContent = "Register as a volunteer";
          }
        });
      } catch (err) {
        console.error(err);
        contentSlot.innerHTML = `<p>Could not load this page. ${err.message || ""}</p>`;
      }
    })();
  </script>
</body>
</html>
