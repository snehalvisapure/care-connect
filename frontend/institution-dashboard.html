<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Institution Dashboard — CareConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --pine: #1F4D3D;
    --pine-dark: #123328;
    --marigold: #D9A441;
    --marigold-dark: #B8842B;
    --cream: #FBF8F2;
    --paper: #FFFFFF;
    --ink: #1D231F;
    --ink-soft: #5B6660;
    --line: #E3DED2;
    --danger: #B3452C;
    --ok: #3D6B4A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0 0 4px 0;
    color:var(--pine-dark);
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  header{
    background:var(--pine);
    color:var(--cream);
    padding:28px 32px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
  }
  header h1{ color:var(--cream); font-size:28px; }
  header p{ margin:4px 0 0; color:#CFE0D6; font-size:14px; }
  .id-box{
    background:var(--pine-dark);
    padding:10px 14px;
    border-radius:6px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
  }
  .id-box input{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--marigold);
    color:var(--cream);
    font-family:'IBM Plex Mono', monospace;
    padding:4px 2px;
    width:70px;
  }
  .id-box input:focus{ outline:none; border-bottom-color:#fff; }
  main{
    max-width:960px;
    margin:0 auto;
    padding:32px;
  }
  section{ margin-bottom:44px; }
  section > .section-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:2px solid var(--pine);
    padding-bottom:8px;
    margin-bottom:16px;
  }
  .status{
    font-size:13px;
    color:var(--ink-soft);
  }
  button{
    font-family:'Public Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    border:none;
    border-radius:5px;
    padding:8px 14px;
    cursor:pointer;
    transition:opacity .15s;
  }
  button:hover{ opacity:.85; }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--pine); color:#fff; }
  .btn-gold{ background:var(--marigold); color:var(--pine-dark); }
  .btn-outline{ background:transparent; color:var(--pine); border:1px solid var(--pine); }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); }
  .btn-accept{ background:var(--ok); color:#fff; }
  .btn-reject{ background:var(--danger); color:#fff; }
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px 20px;
    margin-bottom:14px;
  }
  .card-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
  }
  .tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--pine-dark);
    background:#E7F0EA;
    border-radius:4px;
    padding:2px 8px;
    margin-top:4px;
  }
  .meta{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .rsvp-list{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:13px;
  }
  .rsvp-list div{ padding:2px 0; }
  form.inline-form{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px 20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  form.inline-form .full{ grid-column:1 / -1; }
  label{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    display:block;
    margin-bottom:4px;
  }
  input, select, textarea{
    width:100%;
    font-family:'Public Sans', sans-serif;
    font-size:14px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:5px;
    background:#fff;
    color:var(--ink);
  }
  textarea{ resize:vertical; min-height:60px; }
  .empty{
    color:var(--ink-soft);
    font-size:14px;
    font-style:italic;
    padding:16px 0;
  }
  .error-msg{
    background:#FBEAE4;
    color:var(--danger);
    border:1px solid #EAB9A8;
    border-radius:6px;
    padding:8px 12px;
    font-size:13px;
    margin-bottom:12px;
  }
  .reg-card .status-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:10px;
  }
  .pill-pending{ background:#FCEFD8; color:var(--marigold-dark); }
  .pill-accepted{ background:#E1EFE5; color:var(--ok); }
  .pill-rejected{ background:#FBEAE4; color:var(--danger); }
  .pill-completed{ background:#E3E9F2; color:#3B5378; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Institution Dashboard</h1>
    <p>Manage your events and volunteer requests — CareConnect</p>
  </div>
  <div class="id-box">
    <span>Institution ID</span>
    <input id="institutionIdInput" type="number" min="1" placeholder="e.g. 1">
    <button class="btn-gold" onclick="setInstitutionId()">Load</button>
  </div>
</header>

<main>

  <section id="events-section">
    <div class="section-head">
      <h2>My Events</h2>
      <span class="status mono" id="events-status"></span>
    </div>
    <div id="events-list"></div>

    <h3 style="margin-top:24px;">Create a new event</h3>
    <form class="inline-form" id="create-event-form" onsubmit="handleCreateEvent(event)">
      <div>
        <label>Title</label>
        <input name="title" required>
      </div>
      <div>
        <label>Category</label>
        <select name="category">
          <option value="FESTIVAL">Festival</option>
          <option value="VISIT">Visit</option>
          <option value="CELEBRATION">Celebration</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div>
        <label>Date</label>
        <input name="eventDate" type="date" required>
      </div>
      <div>
        <label>Time (optional)</label>
        <input name="eventTime" type="time">
      </div>
      <div class="full">
        <label>Location</label>
        <input name="location">
      </div>
      <div class="full">
        <label>Description</label>
        <textarea name="description"></textarea>
      </div>
      <div class="full">
        <button type="submit" class="btn-primary">Create event</button>
      </div>
    </form>
  </section>

  <section id="registrations-section">
    <div class="section-head">
      <h2>Volunteer Requests</h2>
      <span class="status mono" id="reg-status"></span>
    </div>
    <form class="inline-form" style="grid-template-columns: auto 1fr auto;" onsubmit="loadRegistrations(event)">
      <div>
        <label>Opportunity ID</label>
        <input id="opportunityIdInput" type="number" min="1" required>
      </div>
      <div></div>
      <div style="align-self:end;">
        <button type="submit" class="btn-outline">Load applicants</button>
      </div>
    </form>
    <div id="registrations-list" style="margin-top:16px;"></div>
  </section>

</main>

<script>
  // Adjust if your webapp is deployed under a context path, e.g. '/CareConnect/api'
  const API_BASE = '/api';

  let institutionId = localStorage.getItem('cc_institutionId') || '';

  function setInstitutionId(){
    const val = document.getElementById('institutionIdInput').value;
    if(!val) return;
    institutionId = val;
    localStorage.setItem('cc_institutionId', val);
    loadEvents();
  }

  window.addEventListener('DOMContentLoaded', () => {
    if(institutionId){
      document.getElementById('institutionIdInput').value = institutionId;
      loadEvents();
    }
  });

  async function apiFetch(path, options={}){
    const res = await fetch(API_BASE + path, {
      headers: {'Content-Type':'application/json'},
      ...options
    });
    let body = null;
    try { body = await res.json(); } catch(e) {}
    if(!res.ok){
      const msg = (body && body.error) ? body.error : ('Request failed (' + res.status + ')');
      throw new Error(msg);
    }
    return body;
  }

  // ---------- EVENTS ----------

  async function loadEvents(){
    const listEl = document.getElementById('events-list');
    const statusEl = document.getElementById('events-status');
    if(!institutionId){
      listEl.innerHTML = '<div class="empty">Enter an institution ID above to load events.</div>';
      return;
    }
    statusEl.textContent = 'loading…';
    try{
      const events = await apiFetch('/events?institutionId=' + encodeURIComponent(institutionId));
      statusEl.textContent = events.length + ' event(s)';
      if(events.length === 0){
        listEl.innerHTML = '<div class="empty">No events yet. Create one below.</div>';
        return;
      }
      listEl.innerHTML = '';
      for(const ev of events){
        listEl.appendChild(renderEventCard(ev));
      }
    } catch(err){
      statusEl.textContent = '';
      listEl.innerHTML = '<div class="error-msg">Could not load events: ' + err.message + '</div>';
    }
  }

  function renderEventCard(ev){
    const wrap = document.createElement('div');
    wrap.className = 'card';
    wrap.innerHTML = `
      <div class="card-row">
        <div>
          <h3>${escapeHtml(ev.title)}</h3>
          <span class="tag">${escapeHtml(ev.category)}</span>
          <div class="meta">${escapeHtml(ev.eventDate || '')} ${ev.eventTime ? ' · ' + escapeHtml(ev.eventTime) : ''} ${ev.location ? ' · ' + escapeHtml(ev.location) : ''}</div>
          <div class="meta">${escapeHtml(ev.description || '')}</div>
        </div>
        <div class="actions">
          <button class="btn-outline" onclick="toggleRsvps(${ev.eventId}, this)">Who's going</button>
          <button class="btn-gold" onclick="startEdit(${ev.eventId})">Edit</button>
          <button class="btn-danger" onclick="deleteEvent(${ev.eventId})">Delete</button>
        </div>
      </div>
      <div class="rsvp-list" id="rsvp-${ev.eventId}" style="display:none;"></div>
      <div id="edit-${ev.eventId}"></div>
    `;
    wrap.dataset.event = JSON.stringify(ev);
    return wrap;
  }

  async function toggleRsvps(eventId, btn){
    const box = document.getElementById('rsvp-' + eventId);
    if(box.style.display === 'block'){
      box.style.display = 'none';
      return;
    }
    box.style.display = 'block';
    box.innerHTML = 'loading…';
    try{
      const [rsvps, countRes] = await Promise.all([
        apiFetch('/rsvps?eventId=' + eventId),
        apiFetch('/rsvps/count?eventId=' + eventId)
      ]);
      if(rsvps.length === 0){
        box.innerHTML = '<div class="empty">No RSVPs yet.</div>';
        return;
      }
      box.innerHTML = '<strong>' + countRes.going + ' going</strong><br>' +
        rsvps.map(r => `<div>User #${r.userId} — <span class="mono">${escapeHtml(r.response)}</span></div>`).join('');
    } catch(err){
      box.innerHTML = '<div class="error-msg">' + err.message + '</div>';
    }
  }

  function startEdit(eventId){
    const card = [...document.querySelectorAll('#events-list .card')]
      .find(c => JSON.parse(c.dataset.event).eventId === eventId);
    const ev = JSON.parse(card.dataset.event);
    const editBox = document.getElementById('edit-' + eventId);
    if(editBox.innerHTML){ editBox.innerHTML = ''; return; }
    editBox.innerHTML = `
      <form class="inline-form" style="margin-top:12px;" onsubmit="submitEdit(event, ${eventId})">
        <div><label>Title</label><input name="title" value="${escapeAttr(ev.title)}" required></div>
        <div>
          <label>Category</label>
          <select name="category">
            ${['FESTIVAL','VISIT','CELEBRATION','OTHER'].map(c =>
              `<option value="${c}" ${ev.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div><label>Date</label><input name="eventDate" type="date" value="${ev.eventDate||''}" required></div>
        <div><label>Time</label><input name="eventTime" type="time" value="${ev.eventTime||''}"></div>
        <div class="full"><label>Location</label><input name="location" value="${escapeAttr(ev.location||'')}"></div>
        <div class="full"><label>Description</label><textarea name="description">${escapeHtml(ev.description||'')}</textarea></div>
        <div class="full">
          <button type="submit" class="btn-primary">Save changes</button>
        </div>
      </form>
    `;
  }

  async function submitEdit(e, eventId){
    e.preventDefault();
    const f = e.target;
    const payload = {
      institutionId: Number(institutionId),
      title: f.title.value,
      description: f.description.value,
      eventDate: f.eventDate.value,
      eventTime: f.eventTime.value || null,
      location: f.location.value,
      category: f.category.value
    };
    try{
      await apiFetch('/events/' + eventId, { method:'PUT', body: JSON.stringify(payload) });
      loadEvents();
    } catch(err){
      alert('Could not save: ' + err.message);
    }
  }

  async function deleteEvent(eventId){
    if(!confirm('Delete this event? This cannot be undone.')) return;
    try{
      await apiFetch('/events/' + eventId, { method:'DELETE' });
      loadEvents();
    } catch(err){
      alert('Could not delete: ' + err.message);
    }
  }

  async function handleCreateEvent(e){
    e.preventDefault();
    if(!institutionId){ alert('Set an institution ID first.'); return; }
    const f = e.target;
    const payload = {
      institutionId: Number(institutionId),
      title: f.title.value,
      description: f.description.value,
      eventDate: f.eventDate.value,
      eventTime: f.eventTime.value || null,
      location: f.location.value,
      category: f.category.value
    };
    try{
      await apiFetch('/events', { method:'POST', body: JSON.stringify(payload) });
      f.reset();
      loadEvents();
    } catch(err){
      alert('Could not create event: ' + err.message);
    }
  }

  // ---------- VOLUNTEER REGISTRATIONS (opportunities) ----------

  async function loadRegistrations(e){
    e.preventDefault();
    const oppId = document.getElementById('opportunityIdInput').value;
    const listEl = document.getElementById('registrations-list');
    const statusEl = document.getElementById('reg-status');
    statusEl.textContent = 'loading…';
    try{
      const regs = await apiFetch('/registrations?opportunityId=' + encodeURIComponent(oppId));
      statusEl.textContent = regs.length + ' applicant(s)';
      if(regs.length === 0){
        listEl.innerHTML = '<div class="empty">No applicants for this opportunity yet.</div>';
        return;
      }
      listEl.innerHTML = '';
      for(const r of regs){
        listEl.appendChild(renderRegistrationCard(r));
      }
    } catch(err){
      statusEl.textContent = '';
      listEl.innerHTML = '<div class="error-msg">' + err.message + '</div>';
    }
  }

  function renderRegistrationCard(r){
    const wrap = document.createElement('div');
    wrap.className = 'card reg-card';
    const status = (r.status || 'PENDING').toUpperCase();
    const pillClass = {
      PENDING:'pill-pending', ACCEPTED:'pill-accepted',
      REJECTED:'pill-rejected', COMPLETED:'pill-completed'
    }[status] || 'pill-pending';

    wrap.innerHTML = `
      <div class="card-row">
        <div>
          <h3>Volunteer #${r.volunteerId}</h3>
          <span class="status-pill ${pillClass}">${status}</span>
        </div>
        <div class="actions" id="reg-actions-${r.registrationId}">
          ${status === 'PENDING' ? `
            <button class="btn-accept" onclick="actOnRegistration(${r.registrationId}, 'accept')">Accept</button>
            <button class="btn-reject" onclick="actOnRegistration(${r.registrationId}, 'reject')">Reject</button>
          ` : ''}
          ${status === 'ACCEPTED' ? `
            <button class="btn-gold" onclick="actOnRegistration(${r.registrationId}, 'complete')">Mark completed</button>
          ` : ''}
        </div>
      </div>
    `;
    return wrap;
  }

  async function actOnRegistration(registrationId, action){
    try{
      await apiFetch('/registrations/' + registrationId + '/' + action, { method:'POST' });
      // reload the current opportunity view
      document.getElementById('opportunityIdInput').closest('form').requestSubmit();
    } catch(err){
      alert('Could not update: ' + err.message);
    }
  }

  // ---------- helpers ----------
  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, s => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[s]));
  }
  function escapeAttr(str){ return escapeHtml(str); }
</script>

</body>
</html>
