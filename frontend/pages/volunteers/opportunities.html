<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer opportunities — CareConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" type="image/png" href="../../assets/images/logo.png" />
</head>
<body>
  <div id="header-slot"></div>

  <main class="container page-section">
    <div class="page-header">
      <h1>Volunteer opportunities</h1>
      <span id="api-badge"></span>
    </div>

    <div id="content-slot">
      <p>Loading...</p>
    </div>
  </main>

  <div id="footer-slot"></div>

  <!-- Shared scripts (order matters: api -> session -> ui-helpers) -->
  <script src="../../js/api.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/ui-helpers.js"></script>
  <!-- /Shared scripts -->

  <script>
    (async () => {
      // Browsing doesn't require login - only applying does.
      const user = await UiHelpers.bootPage({ rootPath: "../../" });

      document.getElementById("api-badge").appendChild(UiHelpers.badge("real"));

      const contentSlot = document.getElementById("content-slot");

      // Where to send people after they log in / register, so they land back here.
      const returnTo = encodeURIComponent(window.location.pathname);
      const LOGIN_URL = "../auth/login.html?redirect=" + returnTo;
      const REGISTER_URL = "../auth/register.html?redirect=" + returnTo; // <-- adjust if your register page lives elsewhere

      // If logged in as a volunteer, figure out (once) whether they have a
      // volunteer profile, and what they've already applied to, so we can show
      // the right button on each card without extra calls per card.
      let myVolunteerProfile = null;
      let myOpportunityIds = new Set();
      const isVolunteerRole = !!user && user.role === "VOLUNTEER";

      if (isVolunteerRole) {
        try {
          const allVolunteers = await Api.volunteers.list();
          myVolunteerProfile = allVolunteers.find((v) => String(v.userId) === String(user.userId)) || null;
          if (myVolunteerProfile) {
            const myRegs = await Api.registrations.listByVolunteer(myVolunteerProfile.volunteerId);
            myOpportunityIds = new Set(myRegs.map((r) => String(r.opportunityId)));
          }
        } catch (err) {
          console.warn("Could not check volunteer status:", err);
        }
      }

      const institutionNameCache = new Map();
      async function institutionName(institutionId) {
        if (institutionNameCache.has(institutionId)) return institutionNameCache.get(institutionId);
        try {
          const inst = await Api.institutions.getById(institutionId);
          institutionNameCache.set(institutionId, inst.institutionName);
          return inst.institutionName;
        } catch (e) {
          return `Institution #${institutionId}`;
        }
      }

      // Builds the action area for ONE card, depending on who is viewing.
      function buildActions(actions, opp) {
        actions.style.display = "flex";
        actions.style.gap = "8px";
        actions.style.flexWrap = "wrap";
        actions.style.alignItems = "center";

        // 1) Logged out -> per-card Log in / Register
        if (!user) {
          const loginBtn = document.createElement("a");
          loginBtn.className = "btn btn-primary btn-sm";
          loginBtn.href = LOGIN_URL;
          loginBtn.textContent = "Log in to apply";
          actions.appendChild(loginBtn);

          const regBtn = document.createElement("a");
          regBtn.className = "btn btn-outline btn-sm";
          regBtn.href = REGISTER_URL;
          regBtn.textContent = "Register";
          actions.appendChild(regBtn);
          return;
        }

        // 2) Logged in but not a volunteer account (donor / institution / admin)
        if (!isVolunteerRole) {
          const note = document.createElement("span");
          note.className = "text-small";
          note.textContent = "Only volunteer accounts can apply.";
          actions.appendChild(note);
          return;
        }

        // 3) Volunteer account without a volunteer profile yet
        if (!myVolunteerProfile) {
          const link = document.createElement("a");
          link.className = "btn btn-primary btn-sm";
          link.href = "register.html";
          link.textContent = "Become a volunteer to apply";
          actions.appendChild(link);
          return;
        }

        // 4) Volunteer with profile -> Apply / Already applied
        if (myOpportunityIds.has(String(opp.opportunityId))) {
          const applied = document.createElement("span");
          applied.className = "status-pill registration-status-APPLIED";
          applied.textContent = "Already applied";
          actions.appendChild(applied);
          return;
        }

        const applyBtn = document.createElement("button");
        applyBtn.className = "btn btn-primary btn-sm";
        applyBtn.type = "button";
        applyBtn.textContent = "Apply";
        applyBtn.addEventListener("click", async () => {
          applyBtn.disabled = true;
          try {
            await Api.registrations.apply(myVolunteerProfile.volunteerId, opp.opportunityId);
            UiHelpers.toast("Applied! Check My applications for status.", "success");
            myOpportunityIds.add(String(opp.opportunityId));
            load();
          } catch (err) {
            console.error(err);
            UiHelpers.toast(err.message || "Could not apply.", "error");
            applyBtn.disabled = false;
          }
        });
        actions.appendChild(applyBtn);
      }

      async function load() {
        let opportunities;
        try {
          opportunities = await Api.opportunities.listOpen();
        } catch (err) {
          console.error(err);
          contentSlot.innerHTML = `<p>Could not load opportunities. ${err.message || ""}</p>`;
          return;
        }

        contentSlot.innerHTML = "";

        const header = document.createElement("div");
        header.className = "page-header";
        header.innerHTML = `<h3 style="margin:0;">${opportunities.length} open opportunit${opportunities.length === 1 ? "y" : "ies"}</h3>`;
        contentSlot.appendChild(header);

        if (opportunities.length === 0) {
          const empty = document.createElement("div");
          empty.className = "card empty-state";
          empty.textContent = "No open opportunities right now.";
          contentSlot.appendChild(empty);
          return;
        }

        const grid = document.createElement("div");
        grid.className = "opportunity-grid";

        for (const opp of opportunities) {
          const instName = await institutionName(opp.institutionId);
          const card = document.createElement("div");
          card.className = "opportunity-card";
          card.innerHTML = `
            <div class="opportunity-card-top">
              <div>
                <strong>${opp.title}</strong>
                <div class="text-small">${instName} · ${opp.location || "—"}</div>
              </div>
              <span class="status-pill opportunity-status-${opp.status}">${opp.status}</span>
            </div>
            <p class="text-small" style="margin:0;">${opp.description || ""}</p>
            <div class="text-small">
              📅 ${UiHelpers.formatDate(opp.eventDate)}
              ${opp.startTime ? " · " + opp.startTime.slice(0, 5) : ""}${opp.endTime ? "–" + opp.endTime.slice(0, 5) : ""}
            </div>
            ${opp.requiredSkills ? `<div class="text-small">Skills wanted: ${opp.requiredSkills}</div>` : ""}
            ${opp.maxVolunteers ? `<div class="text-small">Capacity: ${opp.maxVolunteers}</div>` : ""}
            <div class="opportunity-card-actions"></div>
          `;

          buildActions(card.querySelector(".opportunity-card-actions"), opp);
          grid.appendChild(card);
        }

        contentSlot.appendChild(grid);

        if (isVolunteerRole && myVolunteerProfile) {
          const link = document.createElement("div");
          link.style.marginTop = "16px";
          link.innerHTML = `<a class="btn btn-outline btn-sm" href="my-applications.html">My applications</a>`;
          contentSlot.appendChild(link);
        }
      }

      await load();
    })();
  </script>
</body>
</html>
