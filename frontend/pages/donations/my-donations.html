<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My donations — CareConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" type="image/png" href="../../assets/images/logo.png" />
</head>
<body>
  <div id="header-slot"></div>

  <main class="container page-section">
    <div class="page-header">
      <h1>My donations</h1>
      <span id="api-badge"></span>
    </div>

    <div id="content-slot">
      <p>Loading...</p>
    </div>
  </main>

  <div id="footer-slot"></div>

  <!-- Shared scripts (order matters: api -> session -> ui-helpers) -->
  <script src="../../js/api.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/ui-helpers.js"></script>
  <!-- /Shared scripts -->

  <script>
    (async () => {
      const user = await UiHelpers.bootPage({ rootPath: "../../", requireAuth: true });
      if (!user) return;

      document.getElementById("api-badge").appendChild(UiHelpers.badge("unenforced"));

      const contentSlot = document.getElementById("content-slot");

      // Small cache so we don't refetch the same institution's name
      // repeatedly across rows.
      const institutionNameCache = new Map();
      async function institutionName(institutionId) {
        if (institutionNameCache.has(institutionId)) {
          return institutionNameCache.get(institutionId);
        }
        try {
          const inst = await Api.institutions.getById(institutionId);
          institutionNameCache.set(institutionId, inst.institutionName);
          return inst.institutionName;
        } catch (e) {
          return `Institution #${institutionId}`;
        }
      }

      function money(value) {
        const n = Number(value || 0);
        return `₹${n.toLocaleString("en-IN", { maximumFractionDigits: 2 })}`;
      }

      async function load() {
        let moneyDonations, itemDonations;
        try {
          [moneyDonations, itemDonations] = await Promise.all([
            Api.donations.listByDonor(user.userId),
            Api.itemDonations.listByDonor(user.userId),
          ]);
        } catch (err) {
          console.error(err);
          contentSlot.innerHTML = `<p>Could not load your donations. ${err.message || ""}</p>`;
          return;
        }

        contentSlot.innerHTML = `
          <div style="margin-bottom: 16px;">
            <a class="btn btn-primary btn-sm" href="donate.html">Make a new donation</a>
          </div>
          <h3 class="donation-section-title">Monetary donations</h3>
          <div class="donation-list" id="money-list"></div>
          <h3 class="donation-section-title">Item donations</h3>
          <div class="donation-list" id="item-list"></div>
        `;

        const moneyList = document.getElementById("money-list");
        const itemList = document.getElementById("item-list");

        if (moneyDonations.length === 0) {
          moneyList.innerHTML = `<div class="card empty-state">No monetary donations yet.</div>`;
        }
        for (const d of moneyDonations) {
          const instName = await institutionName(d.institutionId);
          const row = document.createElement("div");
          row.className = "donation-row";
          row.innerHTML = `
            <div class="donation-row-main">
              <strong>${money(d.amount)}</strong> to ${instName}
              ${d.needId ? `<span class="text-small"> · linked to need #${d.needId}</span>` : ""}
              <div class="text-small">${UiHelpers.formatDate(d.donationDate)}${d.receiptNumber ? " · Receipt " + d.receiptNumber : ""}</div>
              <span class="status-pill payment-status-${d.paymentStatus}">${d.paymentStatus}</span>
              ${d.donationStatus === "CANCELLED" ? `<span class="status-pill donation-status-CANCELLED">CANCELLED</span>` : ""}
            </div>
            <div class="donation-row-actions"></div>
          `;

          const actions = row.querySelector(".donation-row-actions");
          if (d.paymentStatus === "PENDING" && d.donationStatus !== "CANCELLED") {
            const confirmBtn = document.createElement("button");
            confirmBtn.className = "btn btn-primary btn-sm";
            confirmBtn.type = "button";
            confirmBtn.textContent = "Confirm payment";
            confirmBtn.title = "No real payment gateway exists yet - this simulates completing the payment.";
            confirmBtn.addEventListener("click", async () => {
              const transactionId = prompt(
                "No real payment gateway is wired up yet - enter any reference to simulate a completed payment:",
                "TXN-" + Date.now()
              );
              if (!transactionId) return;
              try {
                await Api.donations.confirm(d.donationId, transactionId);
                UiHelpers.toast("Payment confirmed. Thank you!", "success");
                load();
              } catch (err) {
                console.error(err);
                UiHelpers.toast(err.message || "Could not confirm payment.", "error");
              }
            });
            actions.appendChild(confirmBtn);

            const cancelBtn = document.createElement("button");
            cancelBtn.className = "btn btn-outline btn-sm";
            cancelBtn.type = "button";
            cancelBtn.textContent = "Cancel pledge";
            cancelBtn.addEventListener("click", async () => {
              if (!confirm("Cancel this pledge?")) return;
              try {
                await Api.donations.cancel(d.donationId);
                UiHelpers.toast("Pledge cancelled.", "success");
                load();
              } catch (err) {
                console.error(err);
                UiHelpers.toast(err.message || "Could not cancel pledge.", "error");
              }
            });
            actions.appendChild(cancelBtn);
          }

          moneyList.appendChild(row);
        }

        if (itemDonations.length === 0) {
          itemList.innerHTML = `<div class="card empty-state">No item donations yet.</div>`;
        }
        for (const item of itemDonations) {
          let instName = `institution`;
          try {
            const parentDonation = await Api.donations.getById(item.donationId);
            instName = await institutionName(parentDonation.institutionId);
          } catch (e) {
            console.warn("Could not load parent donation:", e);
          }

          const row = document.createElement("div");
          row.className = "donation-row";
          row.innerHTML = `
            <div class="donation-row-main">
              <strong>${item.quantity} × ${item.itemName}</strong> to ${instName}
              <div class="text-small">
                ${item.pickupOrDrop === "PICKUP" ? "Pickup from " + (item.pickupAddress || "—") : "Drop-off"}
                ${item.deliveryDate ? " · Delivered " + UiHelpers.formatDate(item.deliveryDate) : ""}
              </div>
              <span class="status-pill delivery-status-${item.deliveryStatus}">${item.deliveryStatus.replace("_", " ")}</span>
            </div>
            <div class="donation-row-actions"></div>
          `;

          const actions = row.querySelector(".donation-row-actions");
          if (item.deliveryStatus === "PENDING" || item.deliveryStatus === "PICKED_UP") {
            const cancelBtn = document.createElement("button");
            cancelBtn.className = "btn btn-outline btn-sm";
            cancelBtn.type = "button";
            cancelBtn.textContent = "Cancel";
            cancelBtn.addEventListener("click", async () => {
              if (!confirm("Cancel this item donation?")) return;
              try {
                await Api.itemDonations.cancel(item.itemDonationId);
                UiHelpers.toast("Item donation cancelled.", "success");
                load();
              } catch (err) {
                console.error(err);
                UiHelpers.toast(err.message || "Could not cancel item donation.", "error");
              }
            });
            actions.appendChild(cancelBtn);
          }

          itemList.appendChild(row);
        }
      }

      await load();
    })();
  </script>
</body>
</html>
