<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit need — CareConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" type="image/png" href="../../assets/images/logo.png" />
</head>
<body>
  <div id="header-slot"></div>

  <main class="container page-section">
    <div class="page-header">
      <h1>Edit need</h1>
      <span id="api-badge"></span>
    </div>

    <div id="content-slot">
      <p>Loading...</p>
    </div>
  </main>

  <div id="footer-slot"></div>

  <!-- Shared scripts (order matters: api -> session -> ui-helpers) -->
  <script src="../../js/api.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/ui-helpers.js"></script>
  <!-- /Shared scripts -->

  <script>
    (async () => {
      const user = await UiHelpers.bootPage({ rootPath: "../../", requireAuth: true });
      if (!user) return;

      document.getElementById("api-badge").appendChild(UiHelpers.badge("real"));

      const contentSlot = document.getElementById("content-slot");
      const params = new URLSearchParams(window.location.search);
      const needId = params.get("id");

      if (!needId) {
        contentSlot.innerHTML = `<p>No need specified in the URL.</p>`;
        return;
      }

      let need;
      try {
        need = await Api.needs.getById(needId);
      } catch (err) {
        console.error(err);
        contentSlot.innerHTML = `<p>Could not load this need. ${err.message || ""}</p>`;
        return;
      }

      contentSlot.innerHTML = `
        <form id="edit-form" class="card" style="max-width: 560px;">
          <div class="form-group">
            <label for="itemName">Item name</label>
            <input type="text" id="itemName" value="${need.itemName}" required />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" value="${need.category}" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="quantityRequired">Quantity needed</label>
              <input type="number" id="quantityRequired" min="1" value="${need.quantityRequired}" required />
              <small>Already received: ${need.quantityReceived} (not editable here - updates automatically as donations are delivered)</small>
            </div>
            <div class="form-group">
              <label for="urgency">Urgency</label>
              <select id="urgency" required>
                <option value="LOW" ${need.urgency === "LOW" ? "selected" : ""}>Low</option>
                <option value="MEDIUM" ${need.urgency === "MEDIUM" ? "selected" : ""}>Medium</option>
                <option value="HIGH" ${need.urgency === "HIGH" ? "selected" : ""}>High</option>
                <option value="CRITICAL" ${need.urgency === "CRITICAL" ? "selected" : ""}>Critical</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" rows="4" required>${need.description || ""}</textarea>
          </div>

          <button type="submit" class="btn btn-primary" id="save-btn">Save changes</button>
        </form>
      `;

      document.getElementById("edit-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById("save-btn");

        const payload = {
          category: document.getElementById("category").value.trim(),
          itemName: document.getElementById("itemName").value.trim(),
          quantityRequired: Number(document.getElementById("quantityRequired").value),
          urgency: document.getElementById("urgency").value,
          description: document.getElementById("description").value.trim(),
        };

        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";
        try {
          await Api.needs.update(needId, payload);
          UiHelpers.toast("Need updated.", "success");
          window.location.href = `list.html?institutionId=${need.institutionId}`;
        } catch (err) {
          console.error(err);
          UiHelpers.toast(err.message || "Could not save changes.", "error");
          saveBtn.disabled = false;
          saveBtn.textContent = "Save changes";
        }
      });
    })();
  </script>
</body>
</html>
