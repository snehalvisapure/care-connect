<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — CareConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" type="image/png" href="../../assets/images/logo.png" />
</head>
<body>
  <div id="header-slot"></div>

  <main class="container page-section" style="max-width: 480px;">
    <div class="page-header">
      <h1>Log in</h1>
      <span id="api-badge"></span>
    </div>

    <form id="login-form" class="card">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn" style="width: 100%;">Log in</button>

      <p class="text-small" style="margin-top: 14px;">
        Don't have an account?
        <a href="register.html">Register</a>
      </p>
    </form>
  </main>

  <div id="footer-slot"></div>

  <!-- Shared scripts (order matters: api -> session -> ui-helpers) -->
  <script src="../../js/api.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/ui-helpers.js"></script>
  <!-- /Shared scripts -->

  <script>
    (async () => {
      const user = await UiHelpers.bootPage({ rootPath: "../../" });
      // Already logged in? No reason to show a login form.
      if (user) {
        window.location.href = "profile.html";
        return;
      }

      document.getElementById("api-badge").appendChild(UiHelpers.badge("real"));

      const form = document.getElementById("login-form");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        try {
          await Session.login(email, password);
          UiHelpers.toast("Logged in.", "success");
          window.location.href = "profile.html";
        } catch (err) {
          console.error(err);
          // ApiError.message is the backend's actual error text, e.g.
          // "Invalid email or password" - safe to show directly.
          UiHelpers.toast(err.message || "Login failed.", "error");
          submitBtn.disabled = false;
          submitBtn.textContent = "Log in";
        }
      });
    })();
  </script>
</body>
</html>
